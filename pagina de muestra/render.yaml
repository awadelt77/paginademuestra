services:
  - type: web
    name: gen-movil
    runtime: node
    buildCommand: npm install --omit=dev || true
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: SETTINGS_FILE
        value: /data/settings.json
      - key: UPLOAD_DIR
        value: /data/img
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
